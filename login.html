<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Золотая обитель</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="header">
    <div class="container header__container">
        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="Золотая обитель" class="logo__img">
            <div>
                <span class="logo__title">Золотая обитель</span>
                <span class="logo__subtitle">Товары буддийской культуры и этнические сувениры</span>
            </div>
        </a>
        <nav class="nav">
            <ul class="nav__list">
                <li><a href="index.html" class="nav__link">Главная</a></li>
                <li><a href="catalog.html" class="nav__link">Каталог</a></li>
                <li><a href="about.html" class="nav__link">О нас</a></li>
                <li><a href="delivery.html" class="nav__link">Доставка</a></li>
                <li><a href="contacts.html" class="nav__link">Контакты</a></li>
            </ul>
        </nav>
        <div class="header__actions">
            <button class="action-btn" aria-label="Поиск" data-search-open>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
            <a href="profile.html" class="action-btn active" aria-label="Профиль" id="profileBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
            <a href="cart.html" class="action-btn" aria-label="Корзина">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                    <path d="M3 6h18"/>
                    <path d="M16 10a4 4 0 0 1-8 0"/>
                </svg>
                <span class="cart-badge">0</span>
            </a>
            <button class="burger" aria-label="Меню"><span></span><span></span><span></span></button>
        </div>
    </div>
</header>

<main>
<section class="section" style="padding: 60px 0;">
    <div class="container" style="max-width: 480px;">
        <div style="background: var(--beige); padding: 40px; border-radius: 16px;">
            <h1 style="font-family: var(--font-accent); font-size: 32px; margin-bottom: 8px;">Вход</h1>
            <p style="color: var(--text-light); margin-bottom: 24px;">Войдите в свой аккаунт</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail *</label>
                    <input type="email" name="email" class="form-control" placeholder="example@mail.ru" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Пароль *</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••" autocomplete="current-password" required>
                </div>
                <p style="text-align:right;margin:-6px 0 12px;font-size:13px;"><a href="forgot-password.html" style="color:var(--gold);font-weight:600;">Забыли пароль?</a></p>
                <div id="authError" style="color:#E53935;font-size:13px;margin-bottom:12px;min-height:18px;"></div>
                <button type="submit" style="width:100%;padding:14px;background:var(--gold);color:white;border-radius:30px;font-weight:600;font-size:14px;border:none;cursor:pointer;">Войти →</button>
            </form>

            <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-light);">
                Нет аккаунта? <a href="register.html" style="color:var(--gold);font-weight:600;">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</section>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer__bottom">
            <p>© 2026 Золотая обитель. Все права защищены.</p>
            <p>Создано с любовью к культуре</p>
        </div>
    </div>
</footer>

<script src="js/database.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/menu.js"></script>
<script src="js/search.js"></script>
</body>
</html>
